# Hexr Runtime Status Page
# https://status.hexr.cloud
owner: hexrdev
repo: upptime

sites:
  # --- Public Endpoints ---
  - name: Cloud API
    url: https://api.hexr.cloud/healthz
    icon: https://hexr.dev/favicon.ico
    expectedStatusCodes:
      - 200

  - name: Documentation
    url: https://docs.hexr.dev
    icon: https://hexr.dev/favicon.ico
    expectedStatusCodes:
      - 200

  - name: Landing Page
    url: https://hexr.dev
    icon: https://hexr.dev/favicon.ico
    expectedStatusCodes:
      - 200

  # --- Identity plane -------------------------------------------------------
  # Added 2026-09-27 after a 22-hour outage that none of the three checks above
  # could see. A Helm upgrade dropped the OIDC Ingress host, so the issuer in
  # every JWT-SVID stopped resolving and GCP refused every cross-cloud
  # credential exchange for a tenant. api.hexr.cloud, docs and the landing page
  # stayed green throughout, because none of them touch the identity plane.
  #
  # These check the contract that actually broke: the issuer serves its own
  # discovery document. One per trust domain — the hostname differs per plane
  # and must match the `iss` claim SPIRE stamps, so a single check cannot cover
  # both.
  - name: OIDC Issuer (EKS)
    url: https://oidc.hexr.dev/.well-known/openid-configuration
    icon: https://hexr.dev/favicon.ico
    expectedStatusCodes:
      - 200

  - name: OIDC Issuer (AKS globex-azure)
    url: https://oidc-globex-azure.hexr.dev/.well-known/openid-configuration
    icon: https://hexr.dev/favicon.ico
    expectedStatusCodes:
      - 200

  # --- Dashboards -----------------------------------------------------------
  # /login rather than /, because / is a 307 redirect to it.
  - name: Control Plane Dashboard
    url: https://cp.hexr.cloud/login
    icon: https://hexr.dev/favicon.ico
    expectedStatusCodes:
      - 200

  - name: Data Plane Dashboard (EKS)
    url: https://dp-demo.hexr.cloud/login
    icon: https://hexr.dev/favicon.ico
    expectedStatusCodes:
      - 200

  - name: Data Plane Dashboard (AKS)
    url: https://dp-globex.hexr.cloud/login
    icon: https://hexr.dev/favicon.ico
    expectedStatusCodes:
      - 200

status-website:
  cname: status.hexr.cloud
  logoUrl: https://hexr.dev/favicon.ico
  name: Hexr Status
  theme: dark
  introTitle: "**Hexr** Runtime Status"
  introMessage: "Real-time health monitoring for the Hexr AI agent runtime platform. All checks run every 5 minutes via GitHub Actions."
  navbar:
    - title: Status
      href: /
    - title: hexr.dev
      href: https://hexr.dev
    - title: Documentation
      href: https://docs.hexr.dev
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

i18n:
  activeIncidents: Current Incidents
  pastIncidents: Past Incidents
  pastIncidentsResolved: Resolved
  allSystemsOperational: All Systems Operational
  incidentReport: Incident Report

workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "*/5 * * * *"
  uptime: "*/5 * * * *"
