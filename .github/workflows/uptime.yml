name: Uptime CI
on:
  schedule:
    # Every 15 minutes, not every 5.
    #
    # At */5 this is 288 runs a day and 8,640 a month, which is what exhausted
    # the Actions budget on 2026-09-29. It is also the blast radius when
    # something breaks: between 2026-08-30 and 2026-09-29 every one of those
    # runs failed on SECRETS_CONTEXT, which is roughly 8,000 failure emails for
    # a single root cause, and 447 failed runs left in history.
    #
    # 15 minutes detects an outage within 15 minutes and costs a third as much.
    # For a public status page that is the right trade — the fast signal for
    # our own planes is scripts/check-oidc-issuer.sh and check-rollouts.sh in
    # the hexr repo, which are run on demand and check contracts rather than
    # liveness.
    - cron: "*/15 * * * *"
  repository_dispatch:
    types: [uptime]
  workflow_dispatch:
jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Check endpoint status
        uses: upptime/uptime-monitor@v1.43.0
        with:
          command: "update"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
          # SECRETS_CONTEXT: ${{ toJson(secrets) }} removed 2026-09-27.
          # GitHub refuses to start any workflow that dumps the whole secrets
          # context this way: the run is created, zero jobs are scheduled, and
          # it is marked action_required forever. Every Uptime CI run for the
          # last month died exactly there, which is why status.hexr.cloud froze
          # on 2026-08-30 data while still calling itself real-time.
          # Upptime only needs this to expand $SECRET references inside
          # .upptimerc.yml; all eight checks are public URLs, so nothing needs it.
