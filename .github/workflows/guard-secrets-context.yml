# Fails if SECRETS_CONTEXT reappears in any workflow.
#
# GitHub refuses to start a workflow that dumps the whole secrets context via
# toJson(secrets): the run is created, zero jobs are scheduled, and it is marked
# action_required forever. It does not fail loudly — it simply never runs.
#
# That is what happened here. Uptime CI, Response Time CI and Setup CI all
# carried SECRETS_CONTEXT, so none of them ran for 28 days while
# status.hexr.cloud kept serving a snapshot from 2026-08-30 and describing
# itself as real-time monitoring. A monitoring system that has silently stopped
# looks exactly like one reporting all-clear.
#
# The upstream Upptime template still ships SECRETS_CONTEXT, so Updates CI and
# Update Template CI (both disabled 2026-09-27) would reintroduce it. Disabling
# them is not enough on its own: a disabled workflow can be re-enabled by anyone
# without realising what it undoes. This check makes that reversal noisy.
#
# Upptime only needs SECRETS_CONTEXT to expand $SECRET references inside
# .upptimerc.yml. Every check here is a public URL, so nothing needs it. If a
# future check genuinely requires a secret, pass that one secret by name rather
# than the whole context.
name: Guard - no SECRETS_CONTEXT
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  guard:
    name: SECRETS_CONTEXT must not reappear
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan workflows
        run: |
          # Match the active YAML key only, so this file's own prose does not trip it.
          if grep -rEn '^[[:space:]]*SECRETS_CONTEXT[[:space:]]*:' .github/workflows/; then
            echo
            echo "::error::SECRETS_CONTEXT is back in a workflow. GitHub will mark those runs"
            echo "::error::action_required and they will never execute, silently stopping monitoring."
            echo "::error::Remove the key. See the comment at the top of this file."
            exit 1
          fi
          echo "OK - no workflow dumps the secrets context"
